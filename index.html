<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>The Canal Ring</title>
<meta name="description" content="Pilot a small wooden boat through the canals of Amsterdam at dusk. Free, runs in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<style>
:root{
  --ink:#f6ece6;
  --ink-dim:rgba(246,236,230,.62);
  --glass:rgba(22,20,52,.46);
  --glass-solid:#1b1a3c;
  --line:rgba(255,255,255,.2);
  --accent:#ffa07c;
  --r-panel:20px;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#120f26;color:var(--ink);font-family:'Manrope',system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(10,6,28,.55) 100%)}
.minimap{position:fixed;left:max(22px,env(safe-area-inset-left));top:max(22px,env(safe-area-inset-top));width:250px;height:176px;padding:6px;border-radius:20px;z-index:3;pointer-events:none}
.minimap canvas{width:100%;height:100%;display:block;border-radius:14px}
.gate{position:fixed;right:max(24px,env(safe-area-inset-right));top:max(22px,env(safe-area-inset-top));z-index:5}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.14),rgba(255,255,255,.03)),var(--glass);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 18px 50px rgba(8,4,24,.4);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%)}
@media (prefers-reduced-transparency:reduce){.glass{background:var(--glass-solid);-webkit-backdrop-filter:none;backdrop-filter:none}}
#gateBtn{display:flex;align-items:center;gap:18px;min-width:210px;padding:10px 10px 10px 20px;border-radius:999px;color:var(--ink);cursor:pointer;font:inherit;text-align:left;transition:transform .25s var(--ease)}
#gateBtn:active{transform:scale(.98)}
#gateBtn:focus-visible,.round:focus-visible,.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gtext{display:flex;flex-direction:column;gap:3px;flex:1}
.gtext b{font-weight:600;font-size:13px;letter-spacing:.01em}
.gtext small{font-size:11px;color:var(--ink-dim);letter-spacing:.04em}
.chev{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:15px;transition:transform .35s var(--ease)}
#gateBtn[aria-expanded=true] .chev{transform:rotate(180deg)}
#menu{position:absolute;right:0;top:calc(100% + 10px);width:290px;padding:10px;border-radius:var(--r-panel);opacity:0;transform:translateY(-8px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease)}
#menu.open{opacity:1;transform:none;pointer-events:auto}
#menu h2{font-size:10px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-dim);padding:10px 12px 6px}
.item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 12px;border:0;border-radius:12px;background:transparent;color:var(--ink);font:inherit;font-size:13.5px;cursor:pointer;text-align:left;transition:background .2s}
.item:hover{background:rgba(255,255,255,.1)}
.item small{color:var(--ink-dim);font-size:11px}
.item[aria-selected=true]{color:var(--accent)}
.dock{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:10px;z-index:4;width:max-content;max-width:calc(100vw - 24px)}
.hint{display:flex;align-items:center;gap:14px;padding:11px 20px;border-radius:999px;font-size:11.5px;color:var(--ink-dim);letter-spacing:.03em;transition:opacity .8s var(--ease),transform .8s var(--ease);white-space:nowrap}
.hint.gone{opacity:0;transform:translateY(8px);pointer-events:none}
kbd{font:600 10.5px 'Manrope',sans-serif;color:var(--ink);padding:3px 7px;border-radius:7px;border:1px solid var(--line);background:rgba(255,255,255,.07);margin-right:2px}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink);font-size:19px;cursor:pointer;transition:transform .25s var(--ease),color .2s}
.round:active{transform:scale(.94)}
.round[aria-pressed=true]{color:var(--accent)}
.pill{height:44px;padding:0 18px 0 14px;border-radius:999px;display:flex;align-items:center;gap:8px;color:var(--ink);font:600 12.5px 'Manrope',sans-serif;letter-spacing:.04em;cursor:pointer;transition:transform .25s var(--ease),box-shadow .35s var(--ease),color .2s,background-color .25s}
.pill i{font-size:18px}
.pill:active{transform:scale(.95)}
.pill:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pill[aria-pressed=true]{color:#2a1210;background:linear-gradient(135deg,#ffc3a6,#ff9a74);border-color:rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 30px rgba(255,150,110,.55)}
.vignette{transition:background .6s var(--ease)}
body.turbo .vignette{background:radial-gradient(95% 75% at 50% 48%,transparent 40%,rgba(30,8,24,.7) 100%)}
.veil{position:fixed;inset:0;background:#120f26;display:grid;place-items:center;z-index:20;transition:opacity .9s var(--ease)}
.veil.off{opacity:0;pointer-events:none}
.veil div{font-family:'Cormorant Garamond',serif;font-size:34px;letter-spacing:.04em;animation:breathe 2.4s ease-in-out infinite}
.veil small{display:block;margin-top:10px;font:500 10.5px 'Manrope',sans-serif;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-dim);text-align:center}
@keyframes breathe{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.veil div{animation:none}#menu,.hint{transition:none}}
.story .gate,.story .dock,.story .wind,.story .toast{display:none}
.wind{position:fixed;left:max(22px,env(safe-area-inset-left));top:calc(max(22px,env(safe-area-inset-top)) + 188px);display:flex;align-items:center;gap:14px;padding:10px 20px 10px 14px;border-radius:999px;z-index:3;pointer-events:none}
.wind i{font-size:22px;color:var(--acc);display:block;transition:transform .2s linear}
.wind b{display:block;font-weight:700;font-size:12.5px;letter-spacing:.03em}
.wind small{display:block;font-size:11px;color:var(--ink-dim);margin-top:2px}
body.sailing .wind{border-color:var(--acc)}
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);padding:12px 22px;border-radius:999px;font-size:13px;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .35s var(--ease);z-index:6;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1}
body.sailing #turboBtn{opacity:.45}
.story .minimap{top:150px;left:18px;width:158px;height:112px}
.story.nomap .minimap{visibility:hidden}
.touch{display:none}
body.has-touch .touch{display:block}
.story .touch{display:none!important}
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tpad{position:fixed;bottom:max(26px,calc(env(safe-area-inset-bottom) + 16px));z-index:4;display:flex;gap:14px}
.tpad-l{left:max(18px,env(safe-area-inset-left))}
.tpad-r{right:max(18px,env(safe-area-inset-right));flex-direction:column}
.tbtn{width:86px;height:86px;border-radius:28px;display:grid;place-items:center;color:var(--ink);font-size:40px;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;transition:transform .12s var(--ease),background-color .15s,box-shadow .2s,color .15s}
.tbtn.on{transform:scale(.92);color:#2a1210;background:linear-gradient(135deg,#ffc3a6,#ff9a74);border-color:rgba(255,255,255,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 30px rgba(255,150,110,.55)}
/* touch layout: actions stack above the right-hand pad, icons only */
body.has-touch .hint{display:none}
body.has-touch .dock{left:auto;right:max(18px,env(safe-area-inset-right));transform:none;bottom:calc(max(26px,calc(env(safe-area-inset-bottom) + 16px)) + 2*86px + 14px + 20px);flex-direction:column;align-items:center;gap:12px;max-width:none}
body.has-touch .pill,body.has-touch .round{width:56px;height:56px;padding:0;border-radius:50%;justify-content:center;display:grid;place-items:center;font-size:24px}
body.has-touch .pill span{display:none}
body.has-touch .pill i{font-size:26px}
body.has-touch .round{font-size:24px}
body.has-touch .toast{bottom:auto;left:auto;right:max(14px,env(safe-area-inset-right));transform:none;top:calc(max(14px,env(safe-area-inset-top)) + 62px);max-width:calc(100vw - 200px);border-radius:22px;text-align:left;line-height:1.35}
@media (max-height:540px){
  .tbtn{width:70px;height:70px;font-size:34px;border-radius:24px}
  .minimap{width:176px;height:124px;left:max(14px,env(safe-area-inset-left));top:12px;padding:4px;border-radius:16px}
  .minimap canvas{border-radius:12px}
  .wind{top:146px;left:max(14px,env(safe-area-inset-left));padding:8px 14px 8px 10px}
  .wind small{display:none}
  .gate{top:12px;right:max(14px,env(safe-area-inset-right))}
  #gateBtn{min-width:0;gap:12px;padding-left:16px}
  .gtext small{display:none}
  body.has-touch .dock{bottom:auto;top:78px;right:max(14px,env(safe-area-inset-right));flex-direction:row}
  body.has-touch .toast{top:140px;max-width:46vw}
  .tpad{bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px))}
}
@media (max-width:640px){
  .wind{top:calc(14px + 118px);left:12px;padding:8px 14px 8px 10px}
  .wind small{display:none}
  .minimap{width:150px;height:106px;left:12px;top:14px;padding:4px;border-radius:14px}
  .minimap canvas{border-radius:10px}
  .pill span{display:none}
  .pill{padding:0 13px}
  .hint{display:none}
  #gateBtn{min-width:0;gap:12px;padding-left:16px}
  .gate{right:14px;top:14px}
  .gtext small{display:none}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Interactive 3D view of a boat on the Amsterdam canals at dusk"></canvas>
<div class="vignette"></div>


<div class="minimap glass" id="minimap"><canvas id="map" aria-label="Map of the canals showing where you are"></canvas></div>

<div class="wind glass" id="windChip"><i class="ph ph-navigation-arrow" id="windArrow"></i><div><b id="windSpd">Wind</b><small id="windTxt">Press F to sail</small></div></div>
<div class="toast glass" id="toast" role="status"></div>

<div class="gate">
  <button id="gateBtn" class="glass" aria-haspopup="true" aria-expanded="false" aria-controls="menu">
    <span class="gtext"><b>The Canal Ring</b><small id="clock">21:20 &middot; sunset</small></span>
    <span class="chev"><i class="ph ph-caret-down"></i></span>
  </button>
  <div id="menu" class="glass" role="menu"></div>
</div>

<div class="touch" id="touch" aria-label="Touch controls">
  <div class="tpad tpad-l">
    <button class="tbtn glass" id="tLeft" aria-label="Steer left"><i class="ph ph-arrow-left"></i></button>
    <button class="tbtn glass" id="tRight" aria-label="Steer right"><i class="ph ph-arrow-right"></i></button>
  </div>
  <div class="tpad tpad-r">
    <button class="tbtn glass" id="tUp" aria-label="Go forward"><i class="ph ph-arrow-up"></i></button>
    <button class="tbtn glass" id="tDown" aria-label="Reverse"><i class="ph ph-arrow-down"></i></button>
  </div>
</div>

<div class="dock">
  <div class="hint glass" id="hint"><span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> steer</span><span><kbd>Space</kbd> turbo</span><span><kbd>F</kbd> sail</span><span><kbd>P</kbd> autopilot</span></div>
  <button class="pill glass" id="sailBtn" aria-pressed="false" aria-label="Sail" title="Sail (F)"><i class="ph ph-sailboat"></i><span>Sail</span></button>
  <button class="pill glass" id="turboBtn" aria-pressed="false" aria-label="Turbo" title="Turbo (Space)"><i class="ph ph-lightning"></i><span>Turbo</span></button>
  <button class="round glass" id="autoBtn" aria-pressed="true" aria-label="Autopilot" title="Autopilot (P)"><i class="ph ph-navigation-arrow"></i></button>
  <button class="round glass" id="soundBtn" aria-pressed="false" aria-label="Sound" title="Sound"><i class="ph ph-speaker-slash"></i></button>
</div>

<div class="veil" id="veil"><div>Amsterdam<small>Lighting the lanterns</small></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
/* ---------- helpers ---------- */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const wrapPI=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a};
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const pick=a=>a[Math.floor(rnd()*a.length)];
const cv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};

/* ---------- renderer / scene ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
const PR=Math.min(window.devicePixelRatio||1,1.75);
renderer.setPixelRatio(PR);
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x7e6392,0.0021);
const camera=new THREE.PerspectiveCamera(58,1,0.3,7000);
const world=new THREE.Group();scene.add(world);
const aniso=renderer.capabilities.getMaxAnisotropy();
const tex=(c,rx,ry)=>{const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=Math.min(8,aniso);if(rx)t.repeat.set(rx,ry||rx);return t};

/* ---------- time of day ---------- */
const C=h=>new THREE.Color(h);
const KEYS=[
 {sunElev:.13,zen:C('#3b5d96'),mid:C('#9a7aa0'),hor:C('#e9a98f'),sunHor:C('#ffb36b'),fog:C('#b88496'),lightCol:C('#ffb070'),lightI:1.05,hemiSky:C('#8fa0d0'),hemiGnd:C('#5a4650'),hemiI:.6,win:.3,lamp:.3,stars:0,deep:C('#142846')},
 {sunElev:.045,zen:C('#2b3f7e'),mid:C('#7a5c96'),hor:C('#c5788f'),sunHor:C('#ff7a52'),fog:C('#7e6392'),lightCol:C('#ff8056'),lightI:.9,hemiSky:C('#7a78b8'),hemiGnd:C('#443848'),hemiI:.55,win:.9,lamp:.8,stars:.05,deep:C('#0c1a36')},
 {sunElev:-.07,zen:C('#0f1838'),mid:C('#34306a'),hor:C('#6a4f88'),sunHor:C('#b8527a'),fog:C('#3a3568'),lightCol:C('#8a7ad0'),lightI:.4,hemiSky:C('#4a58a8'),hemiGnd:C('#2a2540'),hemiI:.45,win:1.3,lamp:1,stars:.6,deep:C('#070f26')}
];
const MOMENTS=[{name:'Golden hour',t:0,label:'20:40 · golden hour'},{name:'Sunset',t:1,label:'21:20 · sunset'},{name:'Blue hour',t:1.9,label:'21:55 · blue hour'}];

/* ---------- sky ---------- */
const sunDir=new THREE.Vector3(.25,.05,1).normalize();
const skyU={zen:{value:new THREE.Color()},mid:{value:new THREE.Color()},hor:{value:new THREE.Color()},sunHor:{value:new THREE.Color()},fogC:{value:new THREE.Color()},sunDir:{value:sunDir},time:{value:0},stars:{value:0}};
const sky=new THREE.Mesh(new THREE.SphereGeometry(3000,48,24),new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,uniforms:skyU,
  vertexShader:`varying vec3 vDir;void main(){vDir=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`varying vec3 vDir;uniform vec3 zen,mid,hor,sunHor,fogC,sunDir;uniform float time,stars;
  float hash(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
  float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);}
  float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*noise(p);p=p*2.03+vec2(11.,7.);a*=.5;}return v;}
  void main(){
    vec3 d=normalize(vDir);float h=max(d.y,0.);
    float sa=max(dot(d,sunDir),0.);
    vec3 col=mix(hor,mid,smoothstep(0.,.3,h));
    col=mix(col,zen,smoothstep(.2,.95,h));
    float sg=pow(sa,3.)*exp(-h*5.);
    col=mix(col,sunHor,clamp(sg*1.25,0.,1.));
    col+=sunHor*pow(sa,48.)*.5+vec3(1.,.82,.62)*pow(sa,700.)*1.6;
    if(d.y>.02){
      vec2 uv=d.xz/(d.y+.14)*.55+vec2(time*.003,0.);
      float c=fbm(uv*vec2(1.,2.4));
      c=smoothstep(.52,.86,c)*smoothstep(0.,.22,d.y)*(1.-smoothstep(.5,.95,d.y));
      vec3 cc=mix(hor,sunHor,.45+.55*sa)*1.18;
      col=mix(col,cc,c*.6);
      vec2 su=vec2(atan(d.z,d.x)*70.,d.y*70.);
      float s=step(.9965,hash(floor(su)))*smoothstep(.08,.35,d.y);
      col+=vec3(.9,.92,1.)*s*stars;
    }
    col=mix(fogC,col,smoothstep(0.,.1,h));
    if(d.y<0.)col=fogC;
    gl_FragColor=vec4(col,1.);
  }`}));
sky.renderOrder=-10;sky.frustumCulled=false;world.add(sky);

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0x7a78b8,0x443848,.5);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xff8056,1.5);scene.add(sun);scene.add(sun.target);

/* ---------- glow ---------- */
const glowTex=(()=>{const c=cv(128,128),x=c.getContext('2d');const g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,214,150,1)');g.addColorStop(.18,'rgba(255,170,90,.55)');g.addColorStop(.5,'rgba(255,120,60,.12)');g.addColorStop(1,'rgba(255,100,40,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.CanvasTexture(c)})();
const glowSprites=[];
function glow(x,y,z,size,opacity=1,parent=world){
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,opacity}));
  s.position.set(x,y,z);s.scale.set(size,size,1);s.userData.base=opacity;parent.add(s);glowSprites.push(s);return s;
}
/* many small lights in one draw call */
const glowSets={big:{size:4.4,p:[],base:.85},small:{size:1.7,p:[],base:.95}};
const glowPoints=[];
function glowAt(set,x,y,z){glowSets[set].p.push(x,y,z)}
function buildGlowPoints(){
  for(const k in glowSets){
    const s=glowSets[k];if(!s.p.length)continue;
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(s.p,3));
    const m=new THREE.PointsMaterial({map:s.tex==='green'?glowGreen:glowTex,size:s.size,sizeAttenuation:true,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false,opacity:s.base});
    m.userData={base:s.base};const pts=new THREE.Points(g,m);pts.frustumCulled=false;world.add(pts);glowPoints.push(m);
  }
}

/* ---------- batching: thousands of house pieces become a handful of draw calls ---------- */
const batches=new Map();
function addGeo(geo,mat4,mats){
  const g=geo.index?geo.toNonIndexed():geo.clone();g.applyMatrix4(mat4);
  const P=g.attributes.position.array,N=g.attributes.normal.array,U=g.attributes.uv?g.attributes.uv.array:null;
  const groups=g.groups.length?g.groups:[{start:0,count:g.attributes.position.count,materialIndex:0}];
  for(const gr of groups){
    const m=Array.isArray(mats)?mats[gr.materialIndex]:mats;
    let b=batches.get(m);if(!b){b={p:[],n:[],u:[]};batches.set(m,b)}
    for(let i=gr.start*3;i<(gr.start+gr.count)*3;i++){b.p.push(P[i]);b.n.push(N[i])}
    for(let i=gr.start*2;i<(gr.start+gr.count)*2;i++)b.u.push(U?U[i]:0);
  }
  g.dispose();
}
function flushBatches(){
  batches.forEach((b,m)=>{
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.Float32BufferAttribute(b.p,3));g.setAttribute('normal',new THREE.Float32BufferAttribute(b.n,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(b.u,2));
    const me=new THREE.Mesh(g,m);me.matrixAutoUpdate=false;world.add(me);
  });
  batches.clear();
}
function boxUV(g,w,h,d,s){
  const uv=g.attributes.uv,dims=[[d,h],[d,h],[w,d],[w,d],[w,h],[w,h]];
  for(let f=0;f<6;f++)for(let i=0;i<4;i++){const k=f*4+i;uv.setXY(k,uv.getX(k)*dims[f][0]/s,uv.getY(k)*dims[f][1]/s)}

}

  MOMENTS.forEach(m=>{const b=document.createElement('button');b.className='item';b.setAttribute('role','menuitemradio');b.dataset.t=m.t;b.innerHTML=`<span>${m.name}</span><small>${m.label.split(' · ')[0]}</small>`;b.onclick=()=>{tNow=m.t;timeLocked=true;closeMenu()};menuEl.appendChild(b)});
  const f=document.createElement('button');f.className='item';f.setAttribute('role','menuitem');f.innerHTML='<span>Let time pass</span><small>slow dusk</small>';f.onclick=()=>{timeLocked=false;closeMenu()};menuEl.appendChild(f);
}
buildMenu();
gateBtn.addEventListener('click',e=>{e.stopPropagation();const o=!menuEl.classList.contains('open');menuEl.classList.toggle('open',o);gateBtn.setAttribute('aria-expanded',o)});
document.addEventListener('click',e=>{if(!menuEl.contains(e.target))closeMenu()});

function applyTime(t){
  t=clamp(t,0,1.999);const i=Math.floor(t),f=t-i,A=KEYS[i],B=KEYS[i+1];
  const L=(k)=>A[k].clone().lerp(B[k],f),N=k=>lerp(A[k],B[k],f);
  skyU.zen.value.copy(L('zen'));skyU.mid.value.copy(L('mid'));skyU.hor.value.copy(L('hor'));skyU.sunHor.value.copy(L('sunHor'));
  const fog=L('fog');skyU.fogC.value.copy(fog);scene.fog.color.copy(fog);wU.fogC.value.copy(fog);
  const el=N('sunElev');sunDir.set(.25,el,1).normalize();sun.position.copy(sunDir).multiplyScalar(1000);
  sun.color.copy(L('lightCol'));sun.intensity=N('lightI');
  hemi.color.copy(L('hemiSky'));hemi.groundColor.copy(L('hemiGnd'));hemi.intensity=N('hemiI');
  wU.deep.value.copy(L('deep'));wU.sunCol.value.copy(L('lightCol'));
  skyU.stars.value=N('stars');
  const win=N('win');winMats.forEach(m=>m.emissiveIntensity=win);
  const lp=N('lamp');glowSprites.forEach(s=>s.material.opacity=s.userData.base*lp);glowPoints.forEach(m=>m.opacity=m.userData.base*lp);
  pointLight.intensity=lerp(.5,1.4,t/2);
  if(window.__clock)window.__clock.color.setRGB(1,lerp(.78,.9,1-t/2),lerp(.5,.65,1-t/2)).multiplyScalar(lerp(.55,1,t/2));
  const m=t<.5?MOMENTS[0]:(t<1.5?MOMENTS[1]:MOMENTS[2]);
  const mins=Math.round(lerp(20*60+40,21*60+55,clamp(t/1.9,0,1)));
  const txt=`${Math.floor(mins/60)}:${String(mins%60).padStart(2,'0')} · ${m.label.split(' · ')[1]}`;
  if(clockEl.textContent!==txt)clockEl.textContent=txt;
  menuEl.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-selected',Math.abs(parseFloat(b.dataset.t)-t)<.35&&timeLocked));
}

/* ---------- audio (free, generated) ---------- */
let ac=null,master,engG,engO,engO2,wG,soundOn=false;
function initAudio(){
  if(ac||!(window.AudioContext||window.webkitAudioContext))return;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
    const len=ac.sampleRate*3,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);let last=0;
    for(let i=0;i<len;i++){last=(last+.02*(Math.random()*2-1))/1.02;d[i]=last*3.5}
    const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=700;wG=ac.createGain();wG.gain.value=.25;
    src.connect(lp).connect(wG).connect(master);src.start();
    const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.18;lg.gain.value=260;lfo.connect(lg).connect(lp.frequency);lfo.start();
    engO=ac.createOscillator();engO.type='sawtooth';engO2=ac.createOscillator();engO2.type='square';
    const ef=ac.createBiquadFilter();ef.type='lowpass';ef.frequency.value=240;engG=ac.createGain();engG.gain.value=.03;
    engO.connect(ef);engO2.connect(ef);ef.connect(engG).connect(master);engO.start();engO2.start();
    soundOn=true;master.gain.linearRampToValueAtTime(.8,ac.currentTime+2);soundBtn.setAttribute('aria-pressed',true);soundBtn.firstElementChild.className='ph ph-speaker-high';
  }catch(_){}
}
soundBtn.addEventListener('click',()=>{
  if(!ac){initAudio();return}
  soundOn=!soundOn;master.gain.cancelScheduledValues(ac.currentTime);master.gain.linearRampToValueAtTime(soundOn?.8:0,ac.currentTime+.4);
  soundBtn.setAttribute('aria-pressed',soundOn);soundBtn.firstElementChild.className='ph '+(soundOn?'ph-speaker-high':'ph-speaker-slash');
});

/* ---------- minimap ---------- */
const mapC=document.getElementById('map'),mctx=mapC.getContext('2d');
const MAP_B={x0:-565,x1:325,z0:-475,z1:140};
let mapW=0,mapH=0,mapStatic=null;
const mx=x=>(x-MAP_B.x0)/(MAP_B.x1-MAP_B.x0)*mapW,my=z=>(z-MAP_B.z0)/(MAP_B.z1-MAP_B.z0)*mapH;
function buildMap(){
  const r=Math.min(2,window.devicePixelRatio||1),cw=mapC.clientWidth,ch=mapC.clientHeight;
  mapC.width=Math.round(cw*r);mapC.height=Math.round(ch*r);mapW=mapC.width;mapH=mapC.height;
  const c=document.createElement('canvas');c.width=mapW;c.height=mapH;const x=c.getContext('2d'),k=mapW/(MAP_B.x1-MAP_B.x0);
  x.fillStyle='#262447';x.fillRect(0,0,mapW,mapH);
  x.fillStyle='#4f7a52';ISLANDS.forEach(is=>x.fillRect(mx(is.x0),my(is.z0),(is.x1-is.x0)*k,(is.z1-is.z0)*k));
  x.fillStyle='#7f98d8';WR.forEach(w=>x.fillRect(mx(w[0]),my(w[2]),(w[1]-w[0])*k,(w[3]-w[2])*k));
  x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=Math.max(1.4,mapW/150);x.lineCap='round';
  MAIN_BRIDGES.forEach(b=>{x.beginPath();x.moveTo(mx(-14),my(b));x.lineTo(mx(14),my(b));x.stroke()});
  CROSS_BRIDGES.forEach(b=>{x.beginPath();x.moveTo(mx(b),my(CROSS_Z-14));x.lineTo(mx(b),my(CROSS_Z+14));x.stroke()});
  x.strokeStyle='rgba(30,20,10,.85)';DRAWBRIDGES.forEach(b=>{x.beginPath();x.moveTo(mx(b[0]-11),my(b[1]));x.lineTo(mx(b[0]+11),my(b[1]));x.stroke()});
  x.fillStyle='#7dff9a';COFFEE_POS.forEach(p=>{x.beginPath();x.arc(mx(p[0]),my(p[1]),Math.max(1.6,mapW/150),0,TAU);x.fill()});
  x.fillStyle='#f6e3c8';[[330,-110],[335,-250],[-420,20],[-380,-350],[110,-470]].forEach(p=>{x.fillRect(mx(p[0])-2,my(p[1])-2,4,4)});
  x.fillStyle='rgba(255,255,255,.88)';x.textAlign='center';x.font=`600 ${Math.max(9,mapW/30)}px Manrope, sans-serif`;
  x.fillText('Herengracht',mx(0),my(95));x.fillText('Leidsegracht',mx(115),my(CROSS_Z-16));x.fillText('Western Islands',mx(-385),my(-5));
  mapStatic=c;
}
let mapT=0;
function drawMap(dt){
  mapT+=dt;if(mapT<.06)return;mapT=0;
  if(!mapStatic||mapC.clientWidth*Math.min(2,window.devicePixelRatio||1)|0!==mapW)buildMap();
  mctx.drawImage(mapStatic,0,0);
  const bx=mx(S.x),by=my(S.z),u=mapW/230;
  mctx.save();mctx.translate(bx,by);
  mctx.fillStyle='rgba(255,160,124,.28)';mctx.beginPath();mctx.arc(0,0,(9+Math.sin(performance.now()/380)*2)*u,0,TAU);mctx.fill();
  mctx.rotate(Math.PI-S.h);
  mctx.fillStyle='#ffa07c';mctx.strokeStyle='#fff';mctx.lineWidth=1.6*u;mctx.beginPath();mctx.moveTo(0,-7*u);mctx.lineTo(5*u,6*u);mctx.lineTo(0,3*u);mctx.lineTo(-5*u,6*u);mctx.closePath();mctx.fill();mctx.stroke();
  mctx.restore();
}

/* ---------- wind chip ---------- */
let windT=0;
function updateWindChip(dt,time){
  windT+=dt;if(windT<.12)return;windT=0;
  const w=S.sail?{psi:WS.psi,spd:WS.spd}:windAt(S.x,S.z,time),ar=document.getElementById('windArrow');
  if(!ar)return;
  ar.style.transform=`rotate(${(-wrapPI(w.psi-S.h)*180/Math.PI).toFixed(0)}deg)`;
  document.getElementById('windSpd').textContent=`Wind ${(w.spd*1.94).toFixed(0)} kn`;
  document.getElementById('windTxt').textContent=S.sail?WS.label:(touchUI?'Tap the sail button':'Press F to sail');
}

/* ---------- loop ---------- */
let camSnap=true,lastT=performance.now(),started=false,idle=0;
const camPos=new THREE.Vector3(),look=new THREE.Vector3(),tmp=new THREE.Vector3();
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){
  const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
  const pw=Math.floor(w*PR),ph=Math.floor(h*PR);wU.res.value.set(pw,ph);rt.setSize(Math.max(2,Math.floor(pw*.55)),Math.max(2,Math.floor(ph*.55)));
  wakeU.scale.value=ph/(2*Math.tan(camera.fov*Math.PI/360));
}
addEventListener('resize',resize);resize();

function step(dt,time){
  const inp=S.auto?autoInput(dt):manualInput();
  const tb=turboOn(),maxV=tb?30:13.5;
  if(S.sail)sailStep(inp,dt,time);
  else{const target=inp.t*maxV;S.v+=(target-S.v)*(1-Math.exp(-dt*(inp.t>=0?(tb?1.7:.9):1.6)))}
  S.steer+=(inp.s-S.steer)*(1-Math.exp(-dt*3.2));
  const turn=S.steer*(.25+.85*Math.min(1,Math.abs(S.v)/6))*(S.v<-.2?-1:1);
  S.w+=(turn-S.w)*(1-Math.exp(-dt*3));
  S.h-=S.w*dt*1.05;
  moveBoat(dt);
  // boat transform
  const bob=Math.sin(time*1.6)*.03+Math.sin(time*2.7)*.015;
  boat.position.set(S.x,.2+bob,S.z);boat.rotation.y=S.h;
  tilt.rotation.z=lerp(tilt.rotation.z,S.w*.28+sailHeel(),.08);
  tilt.rotation.x=lerp(tilt.rotation.x,-clamp(S.v,-3,14)*.006+Math.sin(time*1.3)*.008,.06);
  // wake
  const sp=Math.abs(S.v);
  if(sp>.6){
    const n=Math.min(12,Math.ceil(sp*dt*5)),fx=Math.sin(S.h),fz=Math.cos(S.h),rx=fz,rz=-fx;
    for(let i=0;i<n;i++){
      const o=-2.3-rnd()*.3;
      if(!S.sail)emit(S.x+fx*o,S.z+fz*o,(rnd()-.5)*.25,(rnd()-.5)*.25,.55+rnd()*.35);
      const side=i%2?1:-1;
      emit(S.x+fx*(-.2+rnd()*-.8)+rx*side*.95,S.z+fz*(-.2+rnd()*-.8)+rz*side*.95,rx*side*(.8+rnd()*.5),rz*side*(.8+rnd()*.5),.35+rnd()*.3);
    }
  }
  for(let i=0;i<WN;i++){
    if(wAge[i]<1){wAge[i]+=dt*(.32+sp*.01);wPos[i*3]+=wVel[i*2]*dt;wPos[i*3+2]+=wVel[i*2+1]*dt}
  }
  wakeGeo.attributes.position.needsUpdate=true;wakeGeo.attributes.age.needsUpdate=true;wakeGeo.attributes.size.needsUpdate=true;
  animateWorld(dt,time);
  drawMap(dt);
  updateBirds(dt,time);
  animateMan(time,S.sail);
  updateSail(dt,time);
  updateWindChip(dt,time);
  // camera
  S.camH+=wrapPI(S.h-S.camH)*(1-Math.exp(-dt*(camSnap?60:2.1)));
  const fx=Math.sin(S.camH),fz=Math.cos(S.camH);
  const under=underBridge(S.x,S.z);
  let dist=10.5+Math.min(S.v,30)*.14;const height=under?under:4.5+Math.min(S.v,30)*.03;
  tmp.set(S.x-fx*dist,height,S.z-fz*dist);
  while(!inWater(tmp.x,tmp.z,.6)&&dist>3){dist-=1;tmp.set(S.x-fx*dist,height,S.z-fz*dist)}
  if(camSnap){camPos.copy(tmp)}else camPos.lerp(tmp,1-Math.exp(-dt*5));
  camera.position.copy(camPos);if(tb&&sp>16)camera.position.y+=Math.sin(time*47)*.03;
  if(S.bump>0){const k=S.bump/.45;camera.position.y+=Math.sin(time*85)*.09*k;camera.position.x+=Math.cos(time*70)*.07*k}
  look.set(S.x+fx*9,1.4,S.z+fz*9);camera.lookAt(look);
  camera.fov=lerp(camera.fov,(camera.aspect<1?74:56)+Math.min(Math.abs(S.v),30)*.38,.06);camera.updateProjectionMatrix();camSnap=false;
  if(window.__camFn){const o=window.__camFn(S,window.__shotT||0);camera.position.set(o.p[0],o.p[1],o.p[2]);camera.lookAt(o.l[0],o.l[1],o.l[2]);if(o.fov){camera.fov=o.fov;camera.updateProjectionMatrix()}}
  // engine sound
  if(ac&&engO){const t=ac.currentTime;engO.frequency.setTargetAtTime(46+sp*4.2,t,.1);engO2.frequency.setTargetAtTime(23+sp*2.1,t,.1);engG.gain.setTargetAtTime(S.sail?0:.03+sp*.0045,t,.2);wG.gain.setTargetAtTime(.2+sp*.012,t,.3)}
  // idle hint fade
  if(!hint.classList.contains('gone')){idle+=dt;if(idle>14||(!S.auto&&idle>5))hint.classList.add('gone')}
}

function tick(dt,time){
  if(!timeLocked&&tNow<1.9)tNow=Math.min(1.9,tNow+dt*.0045);
  applyTime(tNow);
  step(dt,time);
  sky.position.set(camera.position.x,0,camera.position.z);
  water.position.set(camera.position.x,0,camera.position.z);
  wU.time.value=time;wU.boat.value.set(S.x,S.z);wU.bs.value=Math.abs(S.v);skyU.time.value=time;
  sun.target.position.set(0,0,0);
  // mirror pass then main pass
  water.visible=false;wake.visible=false;world.scale.y=-1;
  renderer.clippingPlanes=[mirrorPlane];
  renderer.setRenderTarget(rt);renderer.render(scene,camera);
  renderer.setRenderTarget(null);renderer.clippingPlanes=[];
  world.scale.y=1;water.visible=true;wake.visible=true;
  renderer.render(scene,camera);
  if(!started){started=true;requestAnimationFrame(()=>requestAnimationFrame(()=>document.getElementById('veil').classList.add('off')))}
}
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  tick(dt,now/1000);
  requestAnimationFrame(frame);
}
const mirrorPlane=new THREE.Plane(new THREE.Vector3(0,-1,0),0);
window.app={S,OBST,COFFEE_POS,swans,setSail,WS,setTime:t=>{tNow=t;timeLocked=true},setAuto,setTurbo,snap:()=>{camSnap=true},clearWake:()=>{wAge.fill(1)},scene,camera,renderer};
setAuto(true);
if(touchUI&&!/[?&]rec/.test(location.search))setTimeout(()=>toast('Use the arrows to steer. Sail and Turbo are on the right.'),3200);
const REC=/[?&]rec/.test(location.search);
if(REC){
  /* deterministic frame-by-frame mode used to export the MP4 */
  let simT=0;window.__adv=dt=>{simT+=dt;tick(dt,simT)};
  document.getElementById('veil').classList.add('off');hint.classList.add('gone');
  if(/[?&]story/.test(location.search))document.body.classList.add('story');
}else requestAnimationFrame(frame);
})();
</script>
